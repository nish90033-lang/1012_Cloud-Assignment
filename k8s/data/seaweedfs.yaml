# Single-pod SeaweedFS (master + volume + filer + S3 gateway) with an S3 identity taken from the Secret `seaweedfs-s3-config`.
# Data lives on a PVC (k3s local-path), so it survives Pod restarts on the same node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: seaweedfs-data, namespace: data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: seaweedfs, namespace: data}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args: ["server", "-dir=/data", "-volume.max=30", "-master.volumeSizeLimitMB=512",
                 "-filer", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
          ports:
            - {containerPort: 8333, name: s3}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/seaweedfs, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: s3-config
          secret: {secretName: seaweedfs-s3-config}
---
# In-cluster address used by the workers and the service: http://seaweedfs-s3.data.svc.cluster.local:8333
# type LoadBalancer also publishes it on the host (k3d maps 8333) for uploads from the laptop.
apiVersion: v1
kind: Service
metadata: {name: seaweedfs-s3, namespace: data}
spec:
  type: LoadBalancer
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
