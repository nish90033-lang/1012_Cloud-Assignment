# Parallel teacher labelling: an Indexed Job. Pod i gets SHARD_INDEX=i from the Job completion index; SHARD_COUNT=2.
# Both Pods run at the same time (parallelism 2). Ollama runs on the laptop; see README for OLLAMA_HOST=0.0.0.0.
apiVersion: batch/v1
kind: Job
metadata: {name: teacher-labelling, namespace: pipeline}
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: cmdparser-worker:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              valueFrom: {fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}}
            - {name: SHARD_COUNT, value: "2"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs-s3.data.svc.cluster.local:8333"}
            - {name: OLLAMA_URL, value: "http://172.30.192.1:11434"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
